name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true

      - name: Generate Routes
        run: vpr generate-routes

      - name: Check formatting, lint, and types
        run: vp check

      - name: Run tests
        run: vp test --passWithNoTests

      - name: Build application
        run: vp build
